name: Publicar release (Traço Mágico)

# Cria a release do app Traço Mágico com o APK assinado de traco-magico/release/.
# Tag: traco-magico-v<versionName>. Roda quando o APK muda no branch ou manualmente.
on:
  push:
    branches: ["claude/keen-heisenberg-1mbvfi"]
    paths: ["traco-magico/release/**", ".github/workflows/release-traco-magico.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar release com o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep -oP 'versionName = "\K[^"]+' traco-magico/app/build.gradle.kts)"
          TAG="traco-magico-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe — nada a fazer."; exit 0
          fi
          APK="traco-magico/release/TracoMagico-${VERSION}.apk"
          test -f "$APK" || { echo "APK $APK não encontrado"; exit 1; }
          sha256sum "$APK" | sed 's#traco-magico/release/##' > "$APK.sha256"
          cat > notes.md <<NOTES
          ## Traço Mágico ${VERSION} — Foto em Desenho

          Transforme suas fotos em desenhos: 55 estilos (lápis, carvão, lápis de cor, contorno, stencil, desenho animado, hachura, aquarela...) e o modo **Traçar** para copiar o desenho no papel (câmera ou mesa de luz).

          - Android 10 ou superior (minSdk 29, targetSdk 34)
          - APK de release assinado · funciona offline

          ### Instalar
          1. Baixe \`TracoMagico-${VERSION}.apk\` abaixo, no celular.
          2. Abra o arquivo e, se o Android pedir, permita "Instalar apps desconhecidos".

          SHA-256: \`$(cut -d' ' -f1 "$APK.sha256")\`
          NOTES
          gh release create "$TAG" "$APK" "$APK.sha256" --target "$GITHUB_SHA" \
            --title "Traço Mágico ${VERSION}" --notes-file notes.md --latest=false
