name: Publicar release

# Cria a release do GitHub e anexa o APK assinado que está versionado em release/.
# Roda ao enviar uma tag "v*", ao mudar o APK no branch de desenvolvimento,
# ou manualmente (aba Actions → "Publicar release" → Run workflow).
on:
  push:
    tags: ["v*"]
    branches: ["claude/keen-heisenberg-1mbvfi"]
    paths: ["release/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar release com o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            # versão = versionName do app
            TAG="v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe — nada a fazer."; exit 0
          fi
          VERSION="${TAG#v}"
          APK="release/GravaEPrint-${VERSION}.apk"
          test -f "$APK" || { echo "APK $APK não encontrado"; exit 1; }
          sha256sum "$APK" > "$APK.sha256"
          cat > notes.md <<NOTES
          ## Grava & Print ${VERSION}

          Grava a tela do celular em vídeo e, durante a gravação, tira prints pelo botão flutuante, sem interromper o vídeo.

          - Android 10 ou superior (minSdk 29, targetSdk 34)
          - APK de release assinado

          ### Instalar
          1. Baixe o arquivo \`GravaEPrint-${VERSION}.apk\` abaixo, no celular.
          2. Abra o arquivo e, se o Android pedir, permita "Instalar apps desconhecidos".

          SHA-256: \`$(cut -d' ' -f1 "$APK.sha256")\`
          NOTES
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --target "$GITHUB_SHA" --title "Grava & Print ${VERSION}" --notes-file notes.md
